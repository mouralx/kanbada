name: api

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: kanbada-postgres-api
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the stack environment}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the stack environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the stack environment}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - kanbada-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ghcr.io/mouralx/kanbada-api:latest
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      PortalOrigin: ${PORTAL_ORIGIN:-http://localhost:4173}
      Jira__AllowedHosts: ${JIRA_ALLOWED_HOSTS:-}
      Platform__AdminEmails: ${PLATFORM_ADMIN_EMAILS:-}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__Microsoft__ClientId: ${MICROSOFT_CLIENT_ID:-}
      Authentication__Microsoft__ClientSecret: ${MICROSOFT_CLIENT_SECRET:-}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the stack environment}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the stack environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the stack environment}
    ports:
      - "127.0.0.1:5180:5180"
    volumes:
      - ./api/.data-protection:/app/.data-protection
    depends_on:
      postgres:
        condition: service_healthy

  portal:
    image: ghcr.io/mouralx/kanbada-portal:latest
    environment:
      API_PROXY_TARGET: http://api:5180
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "scripts/docker-healthcheck.mjs"]
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 60

  worker:
    image: ghcr.io/mouralx/kanbada-worker:latest
    environment:
      Jira__AllowedHosts: ${JIRA_ALLOWED_HOSTS:-}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the stack environment}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the stack environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the stack environment}
    volumes:
      - ./api/.data-protection:/app/.data-protection
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  kanbada-postgres-data:
    name: kanbada-postgres-data
