name: api

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: kanbada-postgres-api
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run node scripts/setup-local.mjs first}
      POSTGRES_DB: ${POSTGRES_DB:?Run node scripts/setup-local.mjs first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-local.mjs first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - kanbada-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanbada -d kanbada"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: tools/images/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PortalOrigin: http://localhost:4173
      Jira__AllowedHosts: ${JIRA_ALLOWED_HOSTS:-}
      Platform__AdminEmails: ${PLATFORM_ADMIN_EMAILS:-}
      POSTGRES_USER: ${POSTGRES_USER:?Run node scripts/setup-local.mjs first}
      POSTGRES_DB: ${POSTGRES_DB:?Run node scripts/setup-local.mjs first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-local.mjs first}
    ports:
      - "127.0.0.1:5180:5180"
    volumes:
      - ./api/appsettings.Local.json:/app/appsettings.Local.json:ro
      - ./api/.data-protection:/app/.data-protection
    depends_on:
      postgres:
        condition: service_healthy

  portal:
    build:
      context: .
      dockerfile: tools/images/portal.Dockerfile
    environment:
      API_PROXY_TARGET: http://api:5180
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "scripts/docker-healthcheck.mjs"]
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 60

  worker:
    build:
      context: .
      dockerfile: tools/images/worker.Dockerfile
    environment:
      Jira__AllowedHosts: ${JIRA_ALLOWED_HOSTS:-}
      POSTGRES_USER: ${POSTGRES_USER:?Run node scripts/setup-local.mjs first}
      POSTGRES_DB: ${POSTGRES_DB:?Run node scripts/setup-local.mjs first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-local.mjs first}
    volumes:
      - ./api/.data-protection:/app/.data-protection
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  kanbada-postgres-data:
    name: kanbada-postgres-data
