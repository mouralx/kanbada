services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: kanbada-postgres-api
    env_file: .postgres.env
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - kanbada-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanbada -d kanbada"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  kanbada-postgres-data:
    name: kanbada-postgres-data
